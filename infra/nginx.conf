events {}

http {
  # This file replaces the image's nginx.conf: without the types table .js and .css go as text/plain,
  # and nosniff on the Mini App makes the browser refuse them.
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Docker's embedded DNS tracks service containers recreated under the same Compose name.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream eve_agent {
    # Shared state and `resolve` let workers replace a stale container address without a reload.
    zone eve_agent 64k;
    server agent:3000 resolve;
  }

  # The client's address: the proxy in front (Fly's, or Caddy) connects from a private address and appends
  # the client it saw to X-Forwarded-For. Only the last address before the private hops counts, so whatever
  # a client writes into the header itself buys it no fresh rate below (it did until 21 October 2026).
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.0/8;
  set_real_ip_from fc00::/7;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  # No client address, query string or user agent in the log: preview paths travel in the query, and with
  # the real address above the log would keep where each person opens the app from. The times show how fast
  # each route answers.
  log_format osinara '$time_iso8601 $request_method $uri $status $body_bytes_sent $request_time $upstream_response_time';
  access_log /dev/stdout osinara;

  # One opening of «Сегодня» is seven reads and up to four previews at once, and a family at home shares
  # one address.
  limit_req_zone $binary_remote_addr zone=web_app:1m rate=5r/s;
  limit_req_zone $binary_remote_addr zone=web_app_upload:1m rate=6r/m;

  # The Mini App page is read fresh every time. Its scripts and styles carry ?v=<hash of the file>, stamped
  # at image build (scripts/stamp-web-app-assets.sh), so a phone keeps them until a release changes them.
  # Pictures keep for a week: a changed picture gets a new file name.
  map "$uri|$arg_v" $web_app_cache {
    default "no-cache";
    "~^/app/[a-z0-9-]+\.(js|css)\|[0-9a-f]{12}$" "public, max-age=31536000, immutable";
    "~^/app/img/[a-z0-9-]+\.webp\|$" "public, max-age=604800";
  }

  server {
    listen 80;
    client_max_body_size 50m;
    server_tokens off;

    # Telegram is the only public user channel in the current deployment.
    location = /eve/v1/telegram {
      # An update is JSON of a few kilobytes (files arrive through getFile, never in the body); the
      # server-wide limit is for nothing on this public, unauthenticated route.
      client_max_body_size 1m;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://eve_agent;
    }

    # Google uses one fixed GET callback; all session binding comes from one-time state in PostgreSQL.
    location = /eve/v1/google-oauth/callback {
      limit_except GET { deny all; }
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://eve_agent;
    }

    # Health remains public for Docker, Funnel, and future uptime checks.
    location = /eve/v1/health {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://eve_agent;
    }

    # Eve's workflow queue delivers runs to the agent over its own loopback (world-postgres posts to
    # http://localhost:<port>), and the ingress worker uses the internal Docker address. Nothing
    # outside the network needs /.well-known/workflow/, whose handler checks header shape but no
    # secret, so it stays behind the catch-all deny below.

    # Home page and privacy policy that Google's OAuth consent screen links to (infra/public).
    location = / {
      root /usr/share/osinara-public;
      charset utf-8;
      try_files /index.html =404;
    }

    location = /privacy {
      root /usr/share/osinara-public;
      charset utf-8;
      try_files /privacy.html =404;
    }

    # Mini App page (infra/public/app): static files, no inline script, framed only by Telegram Web.
    location /app/ {
      root /usr/share/osinara-public;
      charset utf-8;
      index index.html;
      try_files $uri $uri/ =404;
      add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://telegram.org; style-src 'self'; connect-src 'self'; img-src 'self' data: blob:; base-uri 'none'; form-action 'none'; frame-ancestors https://web.telegram.org" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header Cache-Control $web_app_cache always;
    }

    # Studio photos from the phone: the only Mini App route with a large body, at a slower rate.
    location = /app-api/studio/upload {
      limit_except POST { deny all; }
      client_max_body_size 10m;
      limit_req zone=web_app_upload burst=5 nodelay;
      limit_req_status 429;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://eve_agent;
    }

    # «Надиктовать» in the Mini App: a recording of up to three minutes, at the upload rate (GigaAM does one at a time).
    location = /app-api/voice {
      limit_except POST { deny all; }
      client_max_body_size 6m;
      limit_req zone=web_app_upload burst=5 nodelay;
      limit_req_status 429;
      add_header X-Content-Type-Options nosniff always;
      proxy_http_version 1.1;
      proxy_read_timeout 200s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://eve_agent;
    }

    # Mini App API: Telegram-signed initData in every request; small bodies, a rate per client.
    location /app-api/ {
      limit_except GET POST { deny all; }
      client_max_body_size 4k;
      limit_req zone=web_app burst=40 nodelay;
      limit_req_status 429;
      add_header X-Content-Type-Options nosniff always;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://eve_agent;
    }

    # Do not expose Eve's root UI or session API through the public Funnel.
    location / {
      return 404;
    }
  }
}
